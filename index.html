<body>
<svg class="defs-svg" width="0" height="0" aria-hidden="true" focusable="false"><defs>
<linearGradient id="g-blanca" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffefb"/><stop offset=".85" stop-color="#f1ecdf"/><stop offset="1" stop-color="#d9d2c0"/></linearGradient>
<linearGradient id="g-negra" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4a54"/><stop offset=".12" stop-color="#2a2a32"/><stop offset=".9" stop-color="#0b0b10"/><stop offset="1" stop-color="#26262e"/></linearGradient>
<linearGradient id="g-activa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7aa2ff"/><stop offset="1" stop-color="#2b59c3"/></linearGradient>
<linearGradient id="g-raiz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a78"/><stop offset="1" stop-color="#b8432f"/></linearGradient>
</defs></svg>
<a class="saltar" href="#q">Ir al buscador</a>
<div id="app">
  <header>
    <div class="marca"><span class="logo" aria-hidden="true"><b id="logo-l">E</b><i class="rom">I</i></span><h1 id="titulo">EarPiano</h1></div>
    <div class="acciones"><a id="enlace-timer" class="enlace" href="https://zaenlly1.vercel.app/" aria-label="Abrir TimerPiano" title="TimerPiano"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg></a><button id="tema" type="button"></button></div>
  </header>
  <div id="franja" aria-hidden="true"></div>
  <p id="intro"></p>
  <div id="editor"></div>
  <div id="barra">
    <div class="busca"><input id="q" type="search" placeholder="Buscar canción o artista" aria-label="Buscar canción o artista" autocomplete="off" enterkeyhint="search" title="Atajo: tecla /"><span id="cuenta" class="badge" aria-live="polite"></span></div>
    <div id="pastillas" class="pastillas" role="group" aria-label="Filtrar por tono"></div>
  </div>
  <p id="sin-red" class="aviso-red" role="status" hidden></p>
  <main id="lista"></main>
  <hr>
  <p id="pie"></p>
  <nav id="nav" aria-label="Secciones">
    <button id="nav-canciones" type="button" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>Canciones</span></button>
    <button id="teoria-btn" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/></svg><span>Teoría</span></button>
    <button id="practica-btn" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg><span>Practicar</span></button>
  </nav>
</div>
<div id="cancion" role="dialog" aria-modal="true" aria-label="Canción" tabindex="-1" hidden></div>
